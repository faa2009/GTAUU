<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Word Love-Code</title>
<meta name="description" content="A love message written in falling code." />


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body class="bg-black overflow-hidden">

  <canvas id="scene" aria-hidden="true"></canvas>

  <div id="flash" aria-hidden="true"></div>

  <div id="final-text" class="final-text hidden" aria-live="polite"></div>

  <audio id="bg-music" loop preload="none"></audio>

  <script defer src="script.js"></script>
